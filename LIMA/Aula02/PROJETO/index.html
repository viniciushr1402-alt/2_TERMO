<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCoffee - Painel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4efe9;
            color: #3e2723;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .titulo-topo {
            color: #6f4e37;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitulo {
            font-size: 13px;
            color: #8d6e63;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #e0d7ce;
            margin: 20px 0;
        }

        .menu-navegacao {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-link {
            display: block;
            padding: 12px 16px;
            background-color: #fcfaf8;
            color: #4e342e;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid #e0d7ce;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background-color: #6f4e37;
            color: #ffffff;
            border-color: #6f4e37;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="titulo-topo">SMARTCOFFEE</h1>
        <p class="subtitulo">Aquele cheirinho que você conhece</p>

        <hr>

        <nav class="menu-navegacao">
            <a class="btn-link" href="clientes.html">Clientes</a>
            <a class="btn-link" href="funcionarios.html">Funcionários</a>
            <a class="btn-link" href="estoque.html">Estoque</a>
            <a class="btn-link" href="pagamento.html">Pagamento</a>
            <a class="btn-link" href="pedidos.html">Pedidos</a>
            <a class="btn-link" href="produtos.html">Produtos</a>
            <a class="btn-link" href="delivery.html">Delivery</a>
            <a class="btn-link" href="programa.html">Programa Fidelidade</a>
        </nav>
    </div>

</body>
</html>
