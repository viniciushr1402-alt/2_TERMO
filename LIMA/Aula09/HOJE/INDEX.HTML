            <figure>
                <img src="https://i.pinimg.com/736x/f4/19/de/f419de08e44a25dd2452449eb2b4c054.jpg" alt="Silent Hill 2">
                <p>Silent Hill 2•  Um aclamado jogo de terror de sobrevivência psicológico. A história acompanha James Sunderland, um homem que viaja até a misteriosa e enevoada cidade de Silent Hill após receber uma carta de sua esposa falecida. O jogo é famoso por sua atmosfera opressiva, monstros simbólicos e enredo maduro sobre culpa e trauma.</p> 
            </figure>
        </li>
        <li>
            <figure>
                <img src="https://i.pinimg.com/736x/96/71/68/967168b9ab38d0513f24fb9e1dfa3a8f.jpg" alt="Clair Obscur Expedition 33">
                <p> Clair obscure: Expedition 33• Um grandioso RPG de fantasia sombria com combates em turnos e mecânicas em tempo real. A história segue os membros da "Expedição 33" em uma missão desesperada para destruir a Pintora (Paintress), uma entidade que desperta uma vez por ano para pintar um número mágico e transformar instantaneamente em pó todas as pessoas daquela idade.
</p>
            </figure>
        </li>
        <li>
            <figure>
                <img src="https://i.pinimg.com/736x/3e/e6/48/3ee648c1534775f672398d73bcfbf263.jpg" alt="Hollow Knight Silksong">
                <p>Hollow Knigth: Silk Song:  acompanha a jornada de Hornet, princesa de Hallownest, que é sequestrada por insetos misteriosos e levada para Pharloom, um reino distante governado pela seda e pela música.
Após escapar de sua gaiola no ponto mais baixo desse novo mundo (Bone Bottom), ela precisa lutar para subir até o topo da Cidadela. Nessa jornada vertical, Hornet enfrenta uma maldição de loucura que afeta os habitantes locais e descobre uma trama que envolve fanatismo religioso, o passado de sua própria linhagem com a tribo das Tecelãs e uma antiga divindade adormecida cujo despertar ameaça todo o reino.</p>
            </figure>
        </li>
        <li>
            <figure>
                <img src="https://m.media-amazon.com/images/M/MV5BZTQ3OWJiYjQtOGYzNC00MGIyLWJhZmMtZjNjYWM5YWVkMmU2XkEyXkFqcGc@._V1_.jpg" alt="Dead by Daylight">
                <p>Dead By Dayligth• Um jogo de terror multiplayer assimétrico (4 contra 1). Nele, um jogador assume o papel de um Assassino brutal, enquanto os outros quatro jogam como Sobreviventes que precisam cooperar para consertar geradores e escapar do mapa. É amplamente conhecido por incluir crossovers com grandes ícones do cinema e de outros jogos de terror.</p>
            </figure>
        </li>
    </ul>
