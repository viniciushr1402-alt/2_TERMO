<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="imagens/png.png" type="image/x-icon">
    <title>FAVICONS e IMAGENS </title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2> X-MEN </h2>
    <div>
        <!-- tag pra acrescentar imagens -->
    <img src="imagens/images.jpg" alt="Serie X-men 97" title="X-MEN 97" align="right">
    </div><br>
    

    <h2>X-MEN - com proporção de imagens</h2>
    <div>
    <img src="imagens/images (1).jpg" 
    alt="Serie X-Men 97"
    title="Serie X-Men 97"
    width="300px"
    height="500px"
    border-radius: 10px>
    </div>
    
<h2>X-MEN - com proporção de imagens com style</h2>
<div>
<img src="imagens/images.jpg" 
alt="Serie X-men 97"
title="Serie X-Men 97"
style=
"margin: 20px"

background-image: url(IMAGENS/imagem_xmen.jpg);
background-size: auto;
background-repeat: repeat-y;"
width: 100px;
height= 200px;"

>


</div>
    
</body>
</html>
