<!doctype html><html lang="pt-BR" data-th="dark" data-led="fixo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Minha Coleção de Jogos</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --hue{syntax:'<number>';initial-value:0;inherits:true}
:root{--led:#00e5ff;--bg:#0a0b12;--sf:#141622;--sf2:#1e2132;--tx:#eef0fa;--mu:#9aa0ba;--ln:#ffffff1f;color-scheme:dark;animation:hue 8s linear infinite;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-th=light]{--bg:#eceef6;--sf:#fff;--sf2:#f1f2f9;--tx:#14151f;--mu:#5d6379;--ln:#14152024;color-scheme:light}
:root[data-led=arco]{--led:hsl(var(--hue) 100% 58%)}@keyframes hue{to{--hue:360}}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:clip;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:Unbounded,system-ui,sans-serif;margin:0;line-height:1.15}a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--led);outline-offset:2px}
[hidden]{display:none!important}
#amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}#amb i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--led) 26%,transparent),transparent 65%);animation:drift 24s ease-in-out infinite alternate}#amb i:nth-child(1){top:-25vmax;left:-15vmax}#amb i:nth-child(2){bottom:-30vmax;right:-20vmax;animation-delay:-12s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--led),transparent,var(--led),transparent);background-size:200% 100%;animation:sl 5s linear infinite}@keyframes sl{to{background-position:-200% 0}}
.bar{max-width:1240px;margin:auto;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font:700 19px Unbounded,sans-serif;margin-right:auto;display:flex;align-items:center;gap:10px}.logo::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--led);box-shadow:0 0 14px var(--led);transform:rotate(45deg)}
.btn{border:1px solid var(--ln);background:var(--sf2);border-radius:12px;padding:9px 16px;font-weight:700;display:inline-flex;gap:6px;align-items:center;transition:transform .2s,box-shadow .2s,border-color .2s}.btn:hover{transform:translateY(-2px);border-color:var(--led);box-shadow:0 6px 22px -8px var(--led)}
.btn.p{background:var(--led);color:#06070c;border-color:transparent;box-shadow:0 0 22px -6px var(--led)}.btn.sm{padding:5px 11px;font-size:14px}.btn.on{border-color:var(--led);color:var(--led)}.btn.d{color:#ff5470}
.si{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:9px 14px;width:200px;max-width:100%}
main{max-width:1240px;margin:auto;padding:30px 20px 70px;min-height:75vh}
.top{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}.top h1{font-size:clamp(28px,5vw,46px)}.top p{margin:6px 0 0;color:var(--mu)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}.tb select{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:6px 12px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:24px}
.card{display:block;width:100%;padding:3px;border:0;border-radius:21px;text-align:left;cursor:pointer;background:conic-gradient(from var(--ang),var(--led),color-mix(in srgb,var(--led) 12%,transparent) 25%,transparent 50%,color-mix(in srgb,var(--led) 12%,transparent) 75%,var(--led));animation:rot 5s linear infinite;box-shadow:0 0 26px -8px var(--led);transition:transform .3s,box-shadow .3s}
@keyframes rot{to{--ang:360deg}}.card:hover{transform:translateY(-7px) scale(1.03);box-shadow:0 0 40px -2px var(--led)}
:root[data-led=pulso] .card{animation:rot 5s linear infinite,pls 2.4s ease-in-out infinite}@keyframes pls{50%{box-shadow:0 0 46px 0 var(--led)}}
.in{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:var(--sf)}.im{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .7s}.card:hover .im{transform:scale(1.09)}
.nm{position:absolute;inset:auto 0 0;padding:50px 14px 14px;color:#fff;background:linear-gradient(transparent,#000d);font:700 16px/1.2 Unbounded,sans-serif;overflow-wrap:anywhere}
.fv{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:#0009;color:#fff9;font-size:16px;backdrop-filter:blur(6px);z-index:2}.fv.on{color:#ff4f81}
.bd{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#0009;color:#fff;z-index:2}
.card.add .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--led);font-weight:700}.card.add b{font:500 64px/1 Unbounded;text-shadow:0 0 22px var(--led)}
.empty{border:1px dashed var(--ln);border-radius:18px;padding:50px 20px;text-align:center;background:var(--sf)}.empty h3{margin-bottom:8px}.empty p{color:var(--mu);margin:0 0 16px}
.dh{position:relative;isolation:isolate;padding:10px 0 6px}.dh::before{content:"";position:absolute;inset:-130px calc(50% - 50vw) 0;background:var(--cv) center/cover;filter:blur(55px) saturate(1.5);opacity:.4;z-index:-1;-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.dr{display:flex;gap:30px;align-items:flex-end;flex-wrap:wrap}.dr .card{width:230px;cursor:default}.dr .card:hover{transform:none}.dr h1{font-size:clamp(30px,6vw,64px);margin:6px 0 12px;overflow-wrap:anywhere}
.ch{display:inline-block;border:1px solid var(--led);color:var(--led);border-radius:99px;padding:0 12px;margin:0 6px 6px 0;font-size:14px;font-weight:700}.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pg{max-width:820px;margin:40px 0 0}.pg>p.h{color:var(--mu);margin:0 0 6px}
.b{position:relative;margin:8px 0}.bc{position:absolute;right:0;top:-14px;display:flex;gap:4px;opacity:0;transition:opacity .2s;z-index:3}.b:hover .bc,.b:focus-within .bc{opacity:1}@media(hover:none){.bc{opacity:1}}
.bc button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;width:30px;height:30px;padding:0}
.b textarea,.b input{width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 12px;color:var(--tx);transition:background .2s,border-color .2s}.b textarea:hover,.b input:hover{background:var(--sf)}.b textarea:focus,.b input:focus{background:var(--sf);border-color:var(--led);outline:0;box-shadow:0 0 18px -6px var(--led)}
.b textarea{resize:none;overflow:hidden;font-size:17px;line-height:1.75;min-height:90px}.b input.t{font:700 clamp(22px,3.5vw,32px) Unbounded,sans-serif}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.gal div{position:relative}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;cursor:zoom-in;border:1px solid var(--ln);transition:transform .3s,box-shadow .3s}.gal img:hover{transform:scale(1.03);box-shadow:0 0 24px -6px var(--led)}.gal button.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff}
.vd{width:100%;aspect-ratio:16/9;border:1px solid var(--ln);border-radius:14px;margin-top:8px}
.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px;padding:14px;border:1px dashed var(--ln);border-radius:16px;align-items:center}.ab span{color:var(--mu);width:100%;font-size:14px}
#md{position:fixed;inset:0;z-index:100;background:#05060bbb;backdrop-filter:blur(6px);display:flex;justify-content:center;overflow:auto;padding:20px}.bx{background:var(--sf);border:1px solid var(--led);border-radius:22px;box-shadow:0 0 50px -10px var(--led);padding:24px;width:min(560px,100%);margin:auto}.bx h2{font-size:24px;margin-bottom:16px}
.mf{display:grid;grid-template-columns:150px 1fr;gap:18px}@media(max-width:520px){.mf{grid-template-columns:1fr}.mf .card{max-width:150px}}
.mf .fl{display:flex;flex-direction:column;gap:12px}.bx label{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700}.bx input:not([type=color]):not([type=file]),.bx select{border:1px solid var(--ln);background:var(--sf2);border-radius:10px;padding:8px 12px;font-weight:400}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);box-shadow:0 0 14px -2px var(--c);background:var(--c);padding:0}.sw button:hover{transform:scale(1.15)}input[type=color]{width:56px;height:38px;border:0;background:none;padding:0}
.lb{position:fixed;inset:0;z-index:110;background:#000e;display:flex;align-items:center;justify-content:center;gap:10px}.lb img{max-width:82vw;max-height:88vh;border-radius:12px}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:120;background:var(--sf);border:1px solid var(--led);box-shadow:0 0 24px -6px var(--led);padding:10px 20px;border-radius:12px;font-weight:700}#toast.er{border-color:#ff5470}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="amb" aria-hidden="true"><i></i><i></i></div>
<header><div class="bar"><a class="logo" href="#/" id="lg"></a><input class="si" id="q" type="search" placeholder="Buscar jogo…" aria-label="Buscar jogo"><span id="sv" style="font-size:13px;font-weight:700"></span><button class="btn" data-th aria-label="Alternar claro e escuro" id="thb"></button><button class="btn" data-cz>🎨 Personalizar</button><button class="btn p" data-new>+ Novo jogo</button></div></header>
<main id="app"></main><div id="md" hidden></div><div id="toast" hidden></div><input type="file" id="fj" accept="application/json,.json" hidden><input type="file" id="fi" accept="image/jpeg,image/png,image/webp" multiple hidden>
<script>
const $=s=>document.querySelector(s),R=document.documentElement,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>'b'+Math.random().toString(36).slice(2,9);
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('colecao',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const dbget=async k=>{let v;try{const d=await idb();v=await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}if(v===undefined)try{v=JSON.parse(localStorage.getItem('cl_'+k))||undefined}catch(e){}return v};
const dbset=async(k,v)=>{try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=no});return 1}catch(e){}try{localStorage.setItem('cl_'+k,JSON.stringify(v));return 1}catch(e){}};
const setSv=ok=>{const e=$('#sv');e.textContent=ok?'● Salvo':'⚠ Não está salvando';e.style.color=ok?'#39ff88':'#ff5470'};
const ls=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){}};
let G=[],fav=[],cfg={nome:'Minha Coleção',led:'#00e5ff',mode:'fixo',th:matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'},F={q:'',gen:'',fv:false,ord:'recente'},dr,svT;
const save=()=>{clearTimeout(svT);svT=setTimeout(async()=>{const ok=await dbset('g',G);setSv(ok);if(!ok)toast('Este navegador bloqueou o salvamento. Use Personalizar → Exportar backup.',1)},350)},saveC=()=>{dbset('c',cfg);dbset('f',fav)};
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'er':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
const tx=(t,v)=>({id:uid(),t,v:v||'',imgs:[]});
const mk=(id,nome,genero,hue)=>({id,nome,genero,hue,criado:Date.now()-hue*1e6,demo:true,blocos:[tx('titulo','Esta página é sua'),tx('texto','Jogo de exemplo. Clique em qualquer texto para escrever o que quiser, adicione imagens, vídeos e links pelos botões abaixo. Depois você pode apagar este jogo e criar os seus.')]});
const mig=o=>o.map(g=>({...g,blocos:(g.blocos||[]).flatMap(b=>b.t?[b]:[tx('titulo',b.titulo),b.tipo=='imgs'?{...tx('imgs'),imgs:b.imgs}:b.tipo=='link'?{...tx('link',b.txt),l:b.titulo}:tx(b.tipo=='video'?'video':'texto',b.txt)])}));
const bg=g=>g.capa?`url(${g.capa})`:`linear-gradient(150deg,hsl(${g.hue} 70% 52%),hsl(${(g.hue+60)%360} 65% 20%))`;
const cur=()=>G.find(g=>g.id==location.hash.split('/')[2]),yt=u=>((u||'').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/)||[])[1];
function led(){const g=location.hash.startsWith('#/jogo')?cur():null;R.dataset.th=cfg.th;R.dataset.led=cfg.mode;if(cfg.mode=='arco')R.style.removeProperty('--led');else R.style.setProperty('--led',(g&&g.led)||cfg.led);$('#thb').textContent=cfg.th=='dark'?'☀️ Claro':'🌙 Escuro';$('#lg').textContent=cfg.nome}
const card=g=>`<a class="card" href="#/jogo/${g.id}"><div class="in"><i class="im" style="background-image:${bg(g)}"></i>${g.demo?'<span class="bd">Exemplo</span>':''}<button class="fv ${fav.includes(g.id)?'on':''}" data-fav="${g.id}" aria-label="Favoritar ${esc(g.nome)}">♥</button><span class="nm">${esc(g.nome)}</span></div></a>`;
const list=()=>G.filter(g=>(!F.q||g.nome.toLowerCase().includes(F.q.toLowerCase()))&&(!F.gen||g.genero==F.gen)&&(!F.fv||fav.includes(g.id))).sort((a,b)=>F.ord=='nome'?a.nome.localeCompare(b.nome):b.criado-a.criado);
function home(){const L=list(),gs=[...new Set(G.map(g=>g.genero).filter(Boolean))].sort(),act=F.q||F.gen||F.fv;document.title=cfg.nome;
$('#app').innerHTML=`<div class="top"><div><h1>Minha coleção</h1><p>${G.length} jogo(s) · clique em uma capa para abrir a página dele</p></div></div><div class="tb"><button class="btn sm ${F.gen||F.fv?'':'on'}" data-g="">Todos</button><button class="btn sm ${F.fv?'on':''}" data-fvf>♥ Favoritos</button>${gs.map(x=>`<button class="btn sm ${F.gen==x?'on':''}" data-g="${esc(x)}">${esc(x)}</button>`).join('')}<select id="fo" aria-label="Ordenar"><option value="recente">Mais recentes</option><option value="nome" ${F.ord=='nome'?'selected':''}>Nome A–Z</option></select></div>
${L.length||!act?`<div class="grid">${L.map(card).join('')}${act?'':`<button class="card add" data-new><div class="in"><b>+</b>Adicionar jogo</div></button>`}</div>`:`<div class="empty"><h3>Nada encontrado</h3><p>Nenhum jogo combina com a busca ou filtro.</p><button class="btn p" data-clear>Limpar filtros</button></div>`}`}
function blk(b,i,n){let c='';if(b.t=='titulo')c=`<input class="t" data-bf="v" value="${esc(b.v)}" placeholder="Título da seção" aria-label="Título">`;else if(b.t=='texto')c=`<textarea data-bf="v" placeholder="Escreva o que quiser…" aria-label="Texto">${esc(b.v)}</textarea>`;
else if(b.t=='imgs')c=`<div class="gal">${b.imgs.map((s,k)=>`<div><img src="${s}" data-lb="${b.id}:${k}" alt="Imagem ${k+1}" loading="lazy"><button class="x" data-ri="${b.id}:${k}" aria-label="Remover imagem">✕</button></div>`).join('')}</div><p style="margin:8px 0 0"><button class="btn sm" data-mi="${b.id}">+ mais imagens</button></p>`;
else if(b.t=='video')c=`<input data-bf="v" value="${esc(b.v)}" placeholder="Cole o link do YouTube" aria-label="Link do vídeo">${yt(b.v)?`<iframe class="vd" src="https://www.youtube.com/embed/${yt(b.v)}" allowfullscreen loading="lazy" title="Vídeo"></iframe>`:''}`;
else c=`<input data-bf="l" value="${esc(b.l||'')}" placeholder="Texto do botão (ex.: Site oficial)" aria-label="Texto do link"><input data-bf="v" value="${esc(b.v)}" placeholder="https://…" aria-label="Endereço do link" style="margin-top:6px">${/^https?:\/\//.test(b.v)?`<p style="margin:8px 12px"><a class="btn p" target="_blank" rel="noopener" href="${esc(b.v)}">${esc(b.l||'Abrir link')}</a></p>`:''}`;
return`<div class="b" data-id="${b.id}"><span class="bc">${i?`<button data-bm="${b.id}:-1" aria-label="Subir">↑</button>`:''}${i<n-1?`<button data-bm="${b.id}:1" aria-label="Descer">↓</button>`:''}<button data-bx="${b.id}" aria-label="Remover bloco">✕</button></span>${c}</div>`}
function pgb(){const g=cur(),e=$('#pg');if(!e)return;e.innerHTML=(g.blocos.length?'':`<p class="h">Esta página está em branco. Escreva, coloque imagens, vídeos… do jeito que quiser.</p>`)+g.blocos.map((b,i)=>blk(b,i,g.blocos.length)).join('');grow()}
const grow=()=>document.querySelectorAll('.b textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'});
function detail(){const g=cur();if(!g)return nf();document.title=g.nome+' — '+cfg.nome;
$('#app').innerHTML=`<div class="dh" style="--cv:${bg(g)}"><div class="dr"><div class="card"><div class="in"><i class="im" style="background-image:${bg(g)}"></i></div></div><div style="flex:1;min-width:240px"><div>${g.genero?`<span class="ch">${esc(g.genero)}</span>`:''}${g.ano?`<span class="ch">${g.ano}</span>`:''}${g.nota!==''&&g.nota!=null?`<span class="ch">★ ${g.nota}/10</span>`:''}${g.demo?'<span class="ch">Exemplo</span>':''}</div><h1>${esc(g.nome)}</h1><div class="act"><a class="btn" href="#/">← Coleção</a><button class="btn ${fav.includes(g.id)?'on':''}" data-fav="${g.id}">♥ ${fav.includes(g.id)?'Favorito':'Favoritar'}</button><button class="btn" data-eg="${g.id}">✎ Capa e nome</button><button class="btn" data-lg>✦ LED do jogo</button><button class="btn" data-share>Compartilhar</button><button class="btn d" data-dg="${g.id}">Excluir</button></div></div></div></div>
<div class="pg"><div id="pg"></div><div class="ab"><span>Adicionar à página:</span><button class="btn" data-add="titulo">Aa Título</button><button class="btn" data-add="texto">¶ Texto</button><button class="btn" data-add="imgs">🖼 Imagens</button><button class="btn" data-add="video">▶ Vídeo</button><button class="btn" data-add="link">🔗 Link</button></div></div>`;pgb()}
function nf(){document.title='Não encontrado';$('#app').innerHTML=`<div class="empty"><h3>404</h3><p>Esse jogo não existe (ou foi excluído).</p><a class="btn p" href="#/">Voltar à coleção</a></div>`}
function route(k){const r=location.hash.replace(/^#\/?/,'').split('/')[0];led();if(r==='')home();else if(r=='jogo')detail();else nf();if(!k)scrollTo(0,0)}
function modal(h){const m=$('#md');m.innerHTML=`<div class="bx" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false}const shut=()=>{$('#md').hidden=true};
function ask(m,fn,v){modal(`<h2>${esc(m)}</h2>${v!==undefined?`<label><input id="ai" value="${esc(v)}"></label><br>`:''}<div class="act"><button class="btn p" data-ok>Confirmar</button><button class="btn" data-x>Cancelar</button></div>`);ask.f=fn}
const rz=(f,m)=>new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>12e6)return no('Use JPG, PNG ou WebP de até 12 MB.');const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=()=>no('Imagem inválida.');i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)});
function gform(){const g=dr;modal(`<h2>${g.id?'Editar capa e nome':'Novo jogo'}</h2><div class="mf"><div class="card" id="pc"></div><div class="fl"><label>Nome do jogo *<input data-k="nome" value="${esc(g.nome)}"></label><label>Imagem da capa<input type="file" accept="image/jpeg,image/png,image/webp" data-up></label><label>Gênero (opcional)<input data-k="genero" value="${esc(g.genero)}" placeholder="Ação, RPG, ou o que quiser"></label><label>Nota 0–10 (opcional)<input data-k="nota" type="number" min="0" max="10" step="any" value="${esc(g.nota)}"></label></div></div><div class="act" style="margin-top:18px"><button class="btn p" data-sg>Salvar</button><button class="btn" data-x>Cancelar</button></div>`);upv()}
const upv=()=>{const e=$('#pc');if(e)e.innerHTML=`<div class="in"><i class="im" style="background-image:${bg(dr)}"></i><span class="nm">${esc(dr.nome||'Nome do jogo')}</span></div>`};
function sg(){const g=dr;if(!g.nome.trim())return toast('Informe o nome do jogo.',1);if(g.nota!==''&&g.nota!=null&&(g.nota<0||g.nota>10))return toast('A nota vai de 0 a 10.',1);g.nome=g.nome.trim();g.nota=g.nota===''||g.nota==null?'':+g.nota;
if(g.id)G=G.map(x=>x.id==g.id?g:x);else{g.id='g'+Date.now().toString(36);g.criado=Date.now();g.hue=Math.floor(Math.random()*360);g.blocos=[];G.unshift(g)}save();shut();if(location.hash=='#/jogo/'+g.id){route(1)}else{location.hash='#/jogo/'+g.id;toast('Pronto! Agora escreva o que quiser nesta página.')}}
const PS=['#00e5ff','#7c4dff','#ff2d95','#39ff88','#ff9100','#ff3b30','#ffe600','#ffffff'];
function czf(){modal(`<h2>Personalizar</h2><label>Nome do site<input data-cn value="${esc(cfg.nome)}"></label><br><p style="margin:0;font-weight:700;font-size:14px">Cor do LED</p><div class="sw">${PS.map(c=>`<button style="--c:${c}" data-lc="${c}" aria-label="Cor ${c}"></button>`).join('')}<input type="color" data-lcc value="${cfg.led}" aria-label="Cor personalizada"></div><label>Efeito do LED<select data-lm><option value="fixo" ${cfg.mode=='fixo'?'selected':''}>Cor fixa</option><option value="pulso" ${cfg.mode=='pulso'?'selected':''}>Pulsando</option><option value="arco" ${cfg.mode=='arco'?'selected':''}>Arco-íris animado</option></select></label><br><div class="act"><button class="btn" data-th>Alternar claro / escuro</button><button class="btn" data-exp>⬇ Exportar backup</button><button class="btn" data-imp>⬆ Importar backup</button><button class="btn p" data-x>Pronto</button></div>`)}
function lgf(){const g=cur();modal(`<h2>LED deste jogo</h2><p style="color:var(--mu);margin-top:0">Escolha uma cor só para a página de ${esc(g.nome)}.</p><div class="sw">${PS.map(c=>`<button style="--c:${c}" data-gc="${c}" aria-label="Cor ${c}"></button>`).join('')}<input type="color" data-gcc value="${g.led||cfg.led}" aria-label="Cor personalizada"></div><div class="act"><button class="btn" data-gc="">Usar a cor do site</button><button class="btn p" data-x>Pronto</button></div>`)}
function lb(a,i){const n=a.length,d=document.createElement('div');d.className='lb';d.innerHTML='<button class="btn" data-d="-1" aria-label="Anterior">‹</button><img alt=""><button class="btn" data-d="1" aria-label="Próxima">›</button><button class="btn" data-d="x" aria-label="Fechar" style="position:absolute;top:16px;right:16px">✕</button>';const im=d.querySelector('img'),sh=()=>{im.src=a[i];im.alt='Imagem '+(i+1)},cl=()=>{d.remove();document.removeEventListener('keydown',kd)},mv=k=>{i=(i+k+n)%n;sh()},kd=e=>{if(e.key=='Escape')cl();if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1)};d.onclick=e=>{const v=e.target.dataset.d;if(e.target===d||v=='x')cl();else if(v)mv(+v)};document.addEventListener('keydown',kd);sh();document.body.append(d)}
const blkOf=id=>cur().blocos.find(b=>b.id==id);
addEventListener('hashchange',()=>route());document.addEventListener('keydown',e=>{if(e.key=='Escape')shut()});
$('#q').oninput=e=>{F.q=e.target.value;if(location.hash.replace('#/','')){location.hash='#/'}else home()};
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.bf){blkOf(t.closest('.b').dataset.id)[d.bf]=t.value;if(t.tagName=='TEXTAREA'){t.style.height='auto';t.style.height=t.scrollHeight+'px'}save()}
else if(d.k){dr[d.k]=t.value;upv()}else if(d.cn!==undefined){cfg.nome=t.value||'Minha Coleção';led();saveC()}else if(d.lcc!==undefined){cfg.led=t.value;led();saveC()}else if(d.gcc!==undefined){cur().led=t.value;led();save()}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;if(d.bf&&(t.closest('.b').querySelector('iframe')||blkOf(t.closest('.b').dataset.id).t=='link'||blkOf(t.closest('.b').dataset.id).t=='video'))pgb();
else if(t.id=='fj'){try{const o=JSON.parse(await t.files[0].text());if(!Array.isArray(o.G))throw 0;G=o.G;fav=o.fav||[];cfg={...cfg,...o.cfg};await dbset('g',G);saveC();shut();toast('Backup importado.');route()}catch(x){toast('Arquivo de backup inválido.',1)}t.value=''}
else if(t.id=='fo'){F.ord=t.value;home()}else if(d.lm){cfg.mode=t.value;led();saveC()}
else if(d.up!==undefined){try{dr.capa=await rz(t.files[0],900);upv()}catch(x){toast(typeof x=='string'?x:'Não foi possível ler a imagem.',1)}}
else if(t.id=='fi'){const tg=t.dataset.t,g=cur();try{const im=await Promise.all([...t.files].map(f=>rz(f,1400)));if(tg=='new')g.blocos.push({...tx('imgs'),imgs:im});else blkOf(tg).imgs.push(...im);save();pgb();toast('Imagens adicionadas.')}catch(x){toast(typeof x=='string'?x:'Não foi possível ler a imagem.',1)}t.value=''}});
document.addEventListener('click',e=>{if(e.target.id=='md')return shut();const t=e.target.closest('button,a,img');if(!t)return;const d=t.dataset;
if(d.fav){e.preventDefault();fav=fav.includes(d.fav)?fav.filter(x=>x!=d.fav):[...fav,d.fav];saveC();toast(fav.includes(d.fav)?'Adicionado aos favoritos.':'Removido dos favoritos.');route(1)}
else if(d.new!==undefined){dr={nome:'',genero:'',nota:''};gform()}else if(d.x!==undefined)shut();else if(d.sg!==undefined)sg();
else if(d.ok!==undefined){const f=ask.f,i=$('#ai'),v=i?i.value:'';shut();if(f)f(v)}
else if(d.exp!==undefined){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({G,fav,cfg})],{type:'application/json'}));a.download='colecao-backup.json';a.click();toast('Backup baixado.')}else if(d.imp!==undefined)$('#fj').click();
else if(d.th!==undefined){cfg.th=cfg.th=='dark'?'light':'dark';led();saveC()}else if(d.cz!==undefined)czf();
else if(d.lc){cfg.led=d.lc;if(cfg.mode=='arco')cfg.mode='fixo';led();saveC();czf()}
else if(d.g!==undefined){F.gen=d.g;F.fv=false;home()}else if(d.fvf!==undefined){F.fv=!F.fv;home()}else if(d.clear!==undefined){F={q:'',gen:'',fv:false,ord:F.ord};$('#q').value='';home()}
else if(d.share!==undefined){navigator.share?navigator.share({title:cur().nome,url:location.href}).catch(()=>{}):navigator.clipboard.writeText(location.href).then(()=>toast('Link copiado.'),()=>toast('Copie o endereço na barra do navegador.',1))}
else if(d.eg){dr={...cur()};gform()}else if(d.lg!==undefined)lgf();else if(d.gc!==undefined){cur().led=d.gc||undefined;led();save();lgf()}
else if(d.dg){const g=cur();ask('Excluir "'+g.nome+'"? Não dá para desfazer.',()=>{G=G.filter(x=>x!=g);fav=fav.filter(x=>x!=g.id);save();saveC();toast('Jogo excluído.');location.hash='#/'})}
else if(d.add){const g=cur();if(d.add=='imgs'){$('#fi').dataset.t='new';$('#fi').click()}else{const b=tx(d.add);g.blocos.push(b);save();pgb();const el=document.querySelector(`[data-id="${b.id}"] input,[data-id="${b.id}"] textarea`);if(el)el.focus()}}
else if(d.mi){$('#fi').dataset.t=d.mi;$('#fi').click()}
else if(d.ri){const[id,k]=d.ri.split(':');blkOf(id).imgs.splice(+k,1);save();pgb()}
else if(d.bm){const[id,s]=d.bm.split(':'),a=cur().blocos,i=a.findIndex(b=>b.id==id);[a[i],a[i+ +s]]=[a[i+ +s],a[i]];save();pgb()}
else if(d.bx){const g=cur(),b=blkOf(d.bx),go=()=>{g.blocos=g.blocos.filter(x=>x!=b);save();pgb()};(b.v||b.imgs.length)?ask('Remover este bloco?',go):go()}
else if(d.lb){const[id,k]=d.lb.split(':');lb(blkOf(id).imgs,+k)}});
(async()=>{let g=await dbget('g');if(!g){const o=ls('ct_games');g=o?mig(o):[mk('d1','Neon Drift','Corrida',190),mk('d2','Eclipse of Ashes','RPG',280),mk('d3','Void Harbor','Aventura',330),mk('d4','Crown of Embers','Estratégia',30)];G=g;await dbset('g',G)}else G=g;
const c=await dbget('c'),f=await dbget('f');if(c)cfg={...cfg,...c};fav=f||ls('ct_fav')||[];route();setSv(await dbset('t',1));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})();
const flush=()=>{clearTimeout(svT);dbset('g',G)};addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
</script></body></html>
